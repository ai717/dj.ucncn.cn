<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 唱盘外圈渐变 -->
    <linearGradient id="platterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2029" />
      <stop offset="50%" stop-color="#0e0f14" />
      <stop offset="100%" stop-color="#14161f" />
    </linearGradient>

    <!-- 中心标签渐变 (Deck A 青蓝 -> Deck B 霓虹粉紫) -->
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#ff3366" />
    </linearGradient>

    <!-- 动态光泽反射 -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- 黑胶唱盘基底 -->
  <circle cx="32" cy="32" r="30" fill="url(#platterGrad)" stroke="#00f0ff" stroke-width="1.8" />

  <!-- 黑胶微细音轨圈 (Grooves) -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#2a2d3d" stroke-width="0.8" stroke-dasharray="8 3" opacity="0.8" />
  <circle cx="32" cy="32" r="22" fill="none" stroke="#252736" stroke-width="0.7" stroke-dasharray="14 4" opacity="0.9" />
  <circle cx="32" cy="32" r="18" fill="none" stroke="#2e3246" stroke-width="0.8" opacity="0.6" />

  <!-- 唱盘高光反射扇区 -->
  <path d="M 32 4 A 28 28 0 0 1 56 20 L 32 32 Z" fill="url(#sheenGrad)" />
  <path d="M 32 60 A 28 28 0 0 1 8 44 L 32 32 Z" fill="url(#sheenGrad)" />

  <!-- 中心彩色黑胶标签 (Label Disc) -->
  <circle cx="32" cy="32" r="13" fill="url(#labelGrad)" stroke="#ffffff" stroke-width="0.8" />

  <!-- 中心核心打碟波形 / 字母 S (SpinLab 标志) -->
  <path d="M 27 28 C 27 25 36 24 36 27 C 36 30 28 31 28 34 C 28 38 37 38 37 35" 
        fill="none" stroke="#0e0f14" stroke-width="2.6" stroke-linecap="round" />

  <!-- 中心金属主轴孔 (Spindle Hole) -->
  <circle cx="32" cy="32" r="3" fill="#0e0f14" stroke="#ffffff" stroke-width="0.8" />
</svg>
